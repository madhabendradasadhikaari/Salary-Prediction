<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; color: #333; }
        .card-container { background-color: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 400px; }
        h1 { font-size: 24px; color: #2c3e50; margin-bottom: 10px; }
        .prediction-text { font-size: 32px; color: #27ae60; margin-bottom: 24px; }
        .back-link { display: inline-block; color: #7f8c8d; text-decoration: none; font-size: 14px; transition: 0.3s; }
        .back-link:hover { color: #3498db; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card-container">
        <h1>Estimated Salary</h1>
        
        <!-- Your Python framework will inject the result here -->
        <div class="prediction-text">{{ prediction }}</div>
        
        <a href="/" class="back-link">← Try another prediction</a>
    </div>
</body>
</html>
